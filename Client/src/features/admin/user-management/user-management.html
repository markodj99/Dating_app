<div class="h-[75vh] overflow-auto rounded-box border border-base-content/5 bg-base-100">
    <table class="table">
        <thead>
            <tr>
                <th class="w-1/10">#</th>
                <th class="w-5/10">Email</th>
                <th class="w-3/10">Active roles</th>
                <th class="w-1/10">Actions</th>
            </tr>
        </thead>
        <tbody>
            @for (user of users(); track user.id; let i = $index) {
                <tr>
                    <td class="w-1/10">{{ i + 1 }}</td>
                    <td class="w-5/10">{{ user.email }}</td>
                    <td class="w-3/10">{{ user.roles }}</td>
                    <td class="w-1/10"><button (click)="openRolesModal(user)" class="btn btn-primary">Edit roles</button></td>
                </tr>
            }
        </tbody>
    </table>
</div>

<dialog #rolesModal class="modal">
    <div class="modal-box">
        <h3 class="text-lg font-bold">Edit roles for {{ selectedUser?.userName }}</h3>
        <fieldset class="fieldset w-full p-4 bg-base-100 border border-base-100 rounded-box">
            <legend class="fieldset-legend">Select roles</legend>
            @for (role of availableRoles; track $index) {
                <label class="fieldset-label">
                    <input
                        (change)="toggleRole($event, role)"
                        type="checkbox"
                        [checked]="selectedUser?.roles?.includes(role)"
                        class="checkbox"
                        [disabled]="selectedUser?.email === 'admin@test.com' && role === 'Admin'"
                    >
                    {{ role }}
                </label>
            }
        </fieldset>
        <div class="modal-action">
            <button 
                (click)="updateRoles()"
                class="btn btn-primary"
                [disabled]="selectedUser?.roles?.length === 0"
                >
                Submit
            </button>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>Close</button>
    </form>
</dialog>
