@if (memberService.member(); as member) {
<div class="flex flex-col gap-3">
  <div class="flex gap-2">
    <span class="font-semibold">Member since:</span>
    <span>{{ member.created | date : 'dd MMM yyyy' }}</span>
  </div>
  <div class="flex gap-2">
    <span class="font-semibold">Last active:</span>
    <span>{{ member.lastActive | date : 'dd MMM yyyy' }}</span>
  </div>
  <h3 class="text-lg font-semibold text-primary">About {{ member.username }}</h3>
  @if (memberService.editMode()) {
    <form #editForm="ngForm" (ngSubmit)="updateProfile()" class="flex flex-col w-full gap-4">
      <label class="floating-label">
        <span>Username</span>
        <input
          class="input w-full"
          name="username"
          [(ngModel)]="editableMember.username"
          placeholder="Username"
          type="text"
        />
      </label>
      <label class="floating-label">
        <span>Description</span>
        <textarea
          rows="9"
          class="textarea w-full"
          name="description"
          [(ngModel)]="editableMember.description"
          placeholder="Description"
          type="text"
        ></textarea>
      </label>
      <label class="floating-label">
        <span>City</span>
        <input
          class="input w-full"
          name="city"
          [(ngModel)]="editableMember.city"
          placeholder="City"
          type="text"
        />
      </label>
      <label class="floating-label">
        <span>Country</span>
        <input
          class="input w-full"
          name="country"
          [(ngModel)]="editableMember.country"
          placeholder="Country"
          type="text"
        />
      </label>
      <div class="flex self-end">
        <button [disabled]="!editForm.dirty" type="submit" class="btn btn-success">Submit</button>
      </div>
    </form>
  } @else {
  <div>{{ member.description }}</div>
  }
</div>
}
